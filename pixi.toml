[workspace]
name = "geoscience-ai-readiness"
version = "0.3.0"
description = "Evidence-first geoscience AI-readiness literature tools, rubric and reproducible figures"
authors = ["Marine Denolle <mdenolle@uw.edu>"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64"]
# Static conda-to-PyPI name mapping, so solving works behind firewalls that block conda-mapping.prefix.dev.
conda-pypi-map = { "conda-forge" = "https://raw.githubusercontent.com/prefix-dev/parselmouth/main/files/compressed_mapping.json" }

[dependencies]
python = "3.12.*"
numpy = ">=1.26,<3"
reportlab = ">=4.4,<5"
pillow = "*"
# Poppler supplies pdftoppm, used for PNG export of the figures.
poppler = "*"
pip = "*"
setuptools = ">=68"

[pypi-dependencies]
geoscience-ai-readiness = { path = ".", editable = true }

[feature.study.dependencies]
matplotlib = ">=3.8,<4"

[feature.instrument.dependencies]
python-docx = ">=1.1,<2"

# Opt-in: the Claude API client for the abstract-level semantic screen. Never imported by default;
# `pilot`/`submit` spend money and need existing credentials (none are created here).
[feature.semantic.pypi-dependencies]
anthropic = ">=1,<2"

[feature.semantic.tasks]
das-harvest = { cmd = "python standalone/literature_study.py harvest --config standalone/config.das_topic.json --out runs/das_topic_2026-10-29 --execute --max-pages 20", description = "Harvest the DAS topic frame (network; needs OPENALEX_API_KEY beyond page 1 of each year)" }
das-screen-prepare = { cmd = "python -m ai_readiness.semantic_screen prepare --works runs/das_topic_2026-10-29/works.jsonl --out runs/das_topic_2026-10-29/semantic", description = "Build the semantic-screen requests for the DAS corpus (offline)" }
das-screen-pilot = { cmd = "python -m ai_readiness.semantic_screen pilot --out runs/das_topic_2026-10-29/semantic --limit 5 --execute", description = "Screen five DAS abstracts synchronously (spends money)" }
das-screen-submit = { cmd = "python -m ai_readiness.semantic_screen submit --out runs/das_topic_2026-10-29/semantic --execute --max-usd 40", description = "Submit the DAS semantic-screen batch (spends money)" }
das-screen-collect = { cmd = "python -m ai_readiness.semantic_screen collect --out runs/das_topic_2026-10-29/semantic", description = "Collect the DAS batch into screen_semantic.jsonl" }
das-screen-aggregate = { cmd = "python -m ai_readiness.semantic_screen aggregate --out runs/das_topic_2026-10-29/semantic", description = "Per-year shares with denominators (offline)" }

# Opt-in: executes the analysis notebooks and builds the HTML technical report (offline by default).
[feature.report.dependencies]
nbformat = ">=5.9"
nbclient = ">=0.10"
ipykernel = ">=6.29"

[feature.report.tasks]
notebooks = { cmd = "python scripts/run_notebooks.py", description = "Execute notebooks/ in place (offline; set READINESS_LIVE=1 to re-query OpenAlex/DataCite)" }
figures-readiness = { cmd = "python scripts/archive_readiness_figures.py", description = "Domain-readiness figures into build/archive_readiness" }
report = { cmd = "python scripts/build_report.py", description = "Build docs/report/ai_readiness_solid_earth.html", depends-on = ["figures-readiness"] }
requery-offline = { cmd = "python scripts/requery_check.py --offline", description = "Verify frozen-snapshot hashes" }
requery-live = { cmd = "python scripts/requery_check.py --out runs/requery_$(date +%Y-%m-%d)", description = "Re-query OpenAlex, DataCite and the DAS series live and compare with frozen counts" }

[environments]
default = { features = ["study", "instrument"], solve-group = "default" }
core = { features = [], solve-group = "default" }
semantic = { features = ["study", "instrument", "semantic"] }
report = { features = ["study", "instrument", "report"], solve-group = "default" }

[tasks]
check = { cmd = "python scripts/check_offline.py", description = "Run the figure, preferred-analysis and standalone test suites offline" }
verify = { cmd = "python scripts/verify_release.py", description = "Check release-file SHA-256 hashes" }
figures = { cmd = "python -m aidatasets_figures --out build/figures", description = "Rebuild the DAS activity figure and conceptual schematics" }
readiness-help = "ai-readiness --help"
instrument = { cmd = "python instrument/build_readiness_instrument.py", description = "Rebuild the task-conditioned readiness forms (overwrites dated examples)" }
dry-run = { cmd = "python standalone/literature_study.py harvest --config standalone/config.example.json --dry-run", description = "Standalone harvester dry run (no network)" }
all = { depends-on = ["verify", "check", "figures", "readiness-help"] }
